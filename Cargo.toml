[workspace]
members = [
    "crates/*"
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100.0"
authors = [
    "Hunter Beast <hunter@surmount.systems>",
]
license = "Unlicense"
repository = "https://github.com/SurmountSystems/talents"

[workspace.dependencies]
talents-bip32 = { path = "crates/bip32", version = "0.1.0" }
talents-core = { path = "crates/core", version = "0.1.0" }

# core
bs58 = "0.5.1"
digest = "0.11.3"
hybrid-array = "0.4.15"
hex = { package = "const-hex", version = "1.19.3" }
ripemd = "0.2.0"
serde = "1.0.229"

# bip32
hmac = { version = "0.13.0", features = ["zeroize"] }
secp256k1 = { version = "0.33.1", default-features = false, features = ["recovery", "std"] }
sha2 = { version = "0.11.1", features = ["zeroize"] }
thiserror = "2.0.21"
subtle = "2.6.1"
zeroize = { version = "1.9.2", features = ["derive"] }

# bip39
pbkdf2 = "0.13.0"
rand = { version = "0.10.4", default-features = false }
unicode-normalization = "0.1.26"

# dev
serde_json = "1.0.154"
