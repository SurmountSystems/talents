[package]
name = "talents-bip39"
description = "BIP39 implementation for coins"
keywords = ["bip39", "coins", "crypto", "wallet"]
categories = ["cryptography::cryptocurrencies"]
authors = [
    "Hunter Beast <hunter@surmount.systems>",
]

version.workspace =  true
edition.workspace =  true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
talents-bip32.workspace = true

hmac.workspace = true
pbkdf2.workspace = true
rand.workspace = true
sha2.workspace = true
thiserror.workspace = true
unicode-normalization.workspace = true
subtle.workspace = true
zeroize.workspace = true

[dev-dependencies]
hex.workspace = true
rand = { workspace = true, features = ["thread_rng"] }

[features]
default = ["all-langs"]
all-langs = [
    "chinese-simplified",
    "chinese-traditional",
    "czech",
    "english",
    "french",
    "italian",
    "japanese",
    "korean",
    "portuguese",
    "spanish",
]
chinese-simplified = []
chinese-traditional = []
czech = []
english = []
french = []
italian = []
japanese = []
korean = []
portuguese = []
spanish = []
